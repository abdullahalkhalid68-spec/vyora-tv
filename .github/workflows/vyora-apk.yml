
name: Build VYORA TV APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      - run: ./gradlew :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: VYORA-TV-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/vyoratv.apk

      - name: Publish APK to GitHub Releases
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          name: VYORA TV 1.0.2
          body: |
            VYORA TV Android TV application.

            Based on StreamVault by David Nashash.
            Original project: https://github.com/Davidona/StreamVault-IPTV

            Distributed under the original license.
            See LICENSE in this repository.
          files: app/build/outputs/apk/debug/vyoratv.apk
